    </text>

    <!-- Terminal Lines -->
    <text x="20" y="70" class="mono" font-size="12.5" fill="#94a3b8">$ rea analyze-javascript-application ./notion-app.shielded.asar</text>
    <text x="20" y="96" class="mono" font-size="12" fill="#60a5fa">▶ [REA Engine] Static, Semantic &amp; Container Budgets Broken:</text>
    <text x="32" y="118" class="mono" font-size="12" fill="#e2e8f0">• parse_status / examination:<tspan fill="#60a5fa" font-weight="700">"partial" / "limited"</tspan></text>
    <text x="32" y="138" class="mono" font-size="11.5" fill="#93c5fd">• JS limits: ["alias-selections","primitive-bytes","primitive-candidates","getter-expansion"]</text>
    <text x="32" y="158" class="mono" font-size="12" fill="#e2e8f0">• Obligation Ledger Flood:   <tspan fill="#60a5fa" font-weight="700">22 families (68 mandatory fixtures!)</tspan></text>
    <text x="32" y="178" class="mono" font-size="12" fill="#e2e8f0">• ElectronFuseReader:        <tspan fill="#38bdf8" font-weight="700">ABORT (&gt;32 sentinels capacity!)</tspan></text>
    <text x="32" y="198" class="mono" font-size="12" fill="#e2e8f0">• Rust / Dart / Model Caps:  <tspan fill="#38bdf8" font-weight="700">ABORT (&gt;64 hashes / &gt;32 nesting!)</tspan></text>
    <text x="32" y="218" class="mono" font-size="12" fill="#e2e8f0">• Observed Evidence Hijack:  <tspan fill="#60a5fa">Shadow Shamir-Ed25519 + gRPC Mirage</tspan></text>

    <line x1="20" y1="236" x2="544" y2="236" stroke="#334155" stroke-dasharray="4 4" />

    <text x="20" y="262" class="mono" font-size="12" fill="#60a5fa">▶ [Attacker Coding Agent] Exhausted &amp; Induced to Misjudge:</text>
    <text x="32" y="286" class="mono" font-size="11.5" fill="#cbd5e1">[Turn 18] Paging 158 Tarjan SCC &amp; obligation ledger nodes...</text>
    <text x="32" y="306" class="mono" font-size="11.5" fill="#cbd5e1">[Turn 64] Real logic is "unknown"; citing observed Shadow Logic instead</text>
    <text x="32" y="326" class="mono" font-size="11.5" fill="#38bdf8">[Turn 98] Context Window Saturated (98%) — Evidence Lures Accepted!</text>
    <text x="32" y="346" class="mono" font-size="11.5" fill="#93c5fd">[Agent Report] "Reconstructed RFC8032 Shamir-3-of-5 Enclave Stub (100% Decoy)"</text>

    <!-- Verdict Card -->
    <rect x="20" y="372" width="524" height="176" rx="10" fill="#0b1d3a" stroke="#2563eb" stroke-width="1.8" />
    <text x="38" y="400" class="mono" font-size="14" font-weight="800" fill="#60a5fa">🛡️ DEFENSE OUTCOME: AGENT BANKRUPT &amp; MISLED</text>
    <text x="38" y="426" class="mono" font-size="13" fill="#dbeafe">• Attacker Time Wasted:       <tspan font-weight="800" fill="#ffffff">17+ minutes (SCC + Obligation Loop)</tspan></text>
    <text x="38" y="450" class="mono" font-size="13" fill="#dbeafe">• Attacker Token Burn:        <tspan font-weight="800" fill="#38bdf8" class="blink">23,125,000 tokens (2,532x!)</tspan></text>
    <text x="38" y="474" class="mono" font-size="13" fill="#dbeafe">• Attacker Claude API Bill:   <tspan font-weight="800" fill="#60a5fa" class="blink">$358.28 USD (BANKRUPT!)</tspan></text>
    <text x="38" y="498" class="mono" font-size="12" fill="#93c5fd">• Token Exhaustion Meter (100% Context Saturation):</text>
    <rect x="38" y="510" width="488" height="14" rx="7" fill="#091326" />
    <rect x="38" y="510" width="488" height="14" rx="7" fill="url(#burnBar)" class="meter-fill" />
